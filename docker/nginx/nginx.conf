# Clerkstone reverse proxy — TLS termination, security headers, request-ID.
# Local development uses HTTP; production terminates TLS here (or at Caddy).
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Rate limiting: per-IP request budget (API).
    limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

    # Security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Clerkstone-Data-Class synthetic always;

    upstream api { server api:8000; }
    upstream web { server web:3000; }

    server {
        listen 80 default_server;
        server_name _;
        return 444; # Drop the connection immediately if not a valid domain
    }

    server {
        listen 80;
        server_name excelemma.site www.excelemma.site clerkstone.excelemma.site;

        # API (also serves /docs, /openapi.json and /metrics at the app root).
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location = /docs {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }
        location = /openapi.json {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }
        location = /metrics {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        # Web UI.
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
