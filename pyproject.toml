[project]
name = "clerkstone"
version = "0.1.0"
description = "Clerkstone — FHIR R4 Clinical Record & Data Quality Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fhir.resources>=8.0",
    "pyjwt[crypto]>=2.8",
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "hl7>=0.4",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.5",
    "freezegun>=1.5",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "S"]
ignore = ["S101", "B008"]
# S608/S611: ban raw SQL f-strings where reasonable, but allow parameterised
# SQLAlchemy text() for analytical queries.

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "B011", "E501"]
"backend/alembic/**" = ["E501", "W291"]
"scripts/**" = ["E501", "S311", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["backend/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["backend/tests"]
addopts = "-ra"
